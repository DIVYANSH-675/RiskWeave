[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskweave"
version = "0.1.0"
description = "Constrained policy experiments with learned fuzzy-capacity risk aggregation."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Divyansh Gupta"}]
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/DIVYANSH-675/RiskWeave"
Issues = "https://github.com/DIVYANSH-675/RiskWeave/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff>=0.9"]

[project.scripts]
riskweave = "riskweave.cli:main"
riskweave-artifacts = "riskweave.artifact_cli:main"
riskweave-analysis = "riskweave.analysis_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
